name: Refresh data & deploy site

on:
  schedule:
    - cron: "0 */3 * * 0-3"   # every 3 hours Sun-Wed
    - cron: "0 * * * 4-6"     # hourly Thu-Sat (opponent lineups get posted 1-2 days before the match)
  workflow_dispatch:         # "Run workflow" button on GitHub
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull CPL results + team sheet
        run: python3 scripts/build_data.py
      - name: Cache-bust app files so phones load the newest version
        run: sed -i "s/__V__/${GITHUB_SHA::7}-$(date +%s)/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
