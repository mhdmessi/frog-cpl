name: Refresh data & deploy site

on:
  schedule:
    # Times are UTC. Chicago = UTC-6 in winter (UTC-5 in summer, so everything shifts an hour).
    # Every 2 hours from Wed 12am to Sat midnight Chicago (roster and lineup week):
    - cron: "0 6-22/2 * * 3"  # Wed 12am-4pm Chicago
    - cron: "0 */2 * * 4-6"   # Wed 6pm - Sat 4pm Chicago
    - cron: "0 0-4/2 * * 0"   # Sat 6pm-10pm Chicago
    # Every 3 hours the rest of the week (Sun-Tue):
    - cron: "0 6-21/3 * * 0"
    - cron: "0 */3 * * 1-2"
    - cron: "0 0,3 * * 3"     # Tue 6pm and 9pm Chicago
  workflow_dispatch:         # "Run workflow" button on GitHub
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull CPL results + team sheet
        run: python3 scripts/build_data.py
      - name: Cache-bust app files so phones load the newest version
        run: sed -i "s/__V__/${GITHUB_SHA::7}-$(date +%s)/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
